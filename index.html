<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Signal Scorecard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #1f2937;
      --border: #30363d; --accent: #2ea043; --accent2: #388bfd;
      --danger: #f85149; --text: #e6edf3; --muted: #8b949e; --radius: 10px;
    }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
    .card { width:100%; max-width:720px; background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; max-height:calc(100vh - 20px); display:flex; flex-direction:column; }
    .inner { overflow-y:auto; flex:1; padding:26px 30px 24px; }
    .app-header { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
    .logo-icon { width:38px; height:38px; flex-shrink:0; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:19px; }
    .app-header h1 { font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; }
    .app-header p { font-size:12px; color:var(--muted); margin-top:2px; }
    .field-group { margin-bottom:18px; }
    .row-2 { display:flex; gap:12px; margin-bottom:18px; }
    .row-2 .field-group { flex:1; margin-bottom:0; }
    .row-2 .field-group.narrow { max-width:155px; flex-shrink:0; }
    label { display:block; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:7px; }
    input[type="text"] { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-family:'Inter',sans-serif; font-size:13px; padding:10px 13px; outline:none; transition:border-color 0.15s; }
    input[type="text"]:focus { border-color:var(--accent2); }
    input[type="text"]::placeholder { color:var(--muted); font-size:12px; }
    .readonly { background:var(--surface2); cursor:default; }
    .hint { font-size:11px; color:var(--muted); margin-top:5px; min-height:16px; }
    .hint.resolving { color:var(--accent2); }
    .hint.resolved { color:var(--accent); }
    .hint.error { color:var(--danger); }
    .url-list { display:flex; flex-direction:column; gap:8px; }
    .url-row { display:flex; gap:8px; align-items:center; }
    .url-row input { flex:1; font-size:12px; }
    .url-label { font-size:11px; color:var(--muted); white-space:nowrap; min-width:76px; text-align:right; }
    .remove-btn { background:none; border:1px solid var(--border); border-radius:6px; color:var(--muted); cursor:pointer; font-size:15px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.15s; }
    .remove-btn:hover { border-color:var(--danger); color:var(--danger); }
    .add-link-btn { background:none; border:1px dashed var(--border); border-radius:var(--radius); color:var(--muted); cursor:pointer; font-size:12px; padding:8px 13px; width:100%; margin-top:8px; transition:all 0.15s; font-family:'Inter',sans-serif; }
    .add-link-btn:hover { border-color:var(--accent2); color:var(--accent2); }
    hr { border:none; border-top:1px solid var(--border); margin:20px 0; }
    .steps-row { display:flex; align-items:center; margin-bottom:18px; }
    .step-pill { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); transition:color 0.2s; }
    .step-pill:not(:last-child) { flex:1; }
    .step-connector { flex:1; height:1px; background:var(--border); margin:0 5px; }
    .step-dot { width:22px; height:22px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0; transition:all 0.2s; }
    .step-pill.done { color:var(--accent); }
    .step-pill.done .step-dot { background:var(--accent); border-color:var(--accent); color:#fff; }
    .step-pill.active { color:var(--accent2); }
    .step-pill.active .step-dot { border-color:var(--accent2); animation:pulse 1.2s infinite; }
    .step-pill.error { color:var(--danger); }
    .step-pill.error .step-dot { background:var(--danger); border-color:var(--danger); color:#fff; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(56,139,253,.4);} 50%{box-shadow:0 0 0 5px rgba(56,139,253,0);} }
    #start-btn { width:100%; background:linear-gradient(135deg,var(--accent),#2da44e); border:none; border-radius:var(--radius); color:#fff; cursor:pointer; font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; padding:14px; transition:opacity 0.15s,transform 0.1s; }
    #start-btn:hover:not(:disabled) { opacity:0.9; transform:translateY(-1px); }
    #start-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
    #download-btn { width:100%; background:linear-gradient(135deg,var(--accent2),#1f6feb); border:none; border-radius:var(--radius); color:#fff; cursor:pointer; font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; padding:14px; display:none; transition:opacity 0.15s; }
    #download-btn:hover { opacity:0.9; }
    #restart-btn { width:100%; background:linear-gradient(135deg,#e3b341,#d4920a); border:none; border-radius:var(--radius); color:#000; cursor:pointer; font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; padding:14px; margin-top:8px; display:none; transition:opacity 0.15s; }
    #restart-btn:hover { opacity:0.9; }
    #error-box { background:rgba(248,81,73,0.08); border:1px solid rgba(248,81,73,0.35); border-radius:8px; padding:13px 14px; margin-top:12px; display:none; }
    #error-msg { color:var(--danger); font-size:12px; line-height:1.6; word-break:break-word; }
    #diagnose-btn { margin-top:10px; background:none; border:1px solid rgba(248,81,73,0.5); border-radius:6px; color:var(--danger); cursor:pointer; font-family:'Inter',sans-serif; font-size:12px; padding:7px 14px; transition:all 0.15s; }
    #diagnose-btn:hover { background:rgba(248,81,73,0.1); }
    #diagnose-btn:disabled { opacity:0.5; cursor:not-allowed; }
    #diagnose-results { margin-top:12px; display:none; }
    .diag-item { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--border); font-size:12px; line-height:1.5; }
    .diag-item:last-child { border-bottom:none; }
    .diag-icon { font-size:14px; flex-shrink:0; margin-top:1px; }
    .diag-label { font-weight:600; color:var(--text); }
    .diag-detail { color:var(--muted); margin-top:2px; }
    .diag-fix { color:var(--accent2); margin-top:3px; font-style:italic; }
    footer { margin-top:14px; color:var(--muted); font-size:11px; }
  </style>
</head>
<body>

<div class="card">
  <div class="inner">

    <!-- PROGRESS BAR -->
    <div id="progress-bar-wrap" style="background:#0a0e14;border:1px solid var(--border);border-radius:50px;padding:5px 14px 5px 6px;display:flex;align-items:center;gap:10px;margin-bottom:18px;overflow:hidden;">
      <div id="progress-bar-track" style="flex:1;height:8px;background:var(--surface2);border-radius:50px;overflow:hidden;">
        <div id="progress-bar-fill" style="height:100%;width:0%;background:linear-gradient(90deg,#00e676,#00b0ff);border-radius:50px;box-shadow:0 0 8px #00e67688;transition:width 0.35s ease;"></div>
      </div>
      <span id="progress-label" style="font-size:11px;color:var(--muted);white-space:nowrap;">Ready</span>
      <span id="progress-pct" style="font-size:12px;font-weight:700;color:#00e676;font-family:'Space Grotesk',sans-serif;min-width:34px;text-align:right;">0%</span>
    </div>

    <!-- HEADER -->
    <div class="app-header">
      <div class="logo-icon">📊</div>
      <div>
        <h1>Stock Signal Scorecard</h1>
        <p>Enter a ticker to generate your complete AI-powered scorecard</p>
      </div>
    </div>

    <!-- FORM FIELDS (hidden after completion) -->
    <div id="form-fields">
      <div class="field-group" style="margin-bottom:12px;">
        <label>Exchange</label>
        <div style="display:flex;gap:18px;padding-top:2px;">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);cursor:pointer;">
            <input type="radio" name="exchange" id="exchange-ca" value="CA" checked onchange="onExchangeChange()" /> Canada (TSX)
          </label>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);cursor:pointer;">
            <input type="radio" name="exchange" id="exchange-us" value="US" onchange="onExchangeChange()" /> United States
          </label>
        </div>
      </div>
      <div class="field-group" style="margin-bottom:12px;">
        <label>Search by Company Name <span style="color:var(--muted);font-weight:400;text-transform:none;">(type name to find ticker)</span></label>
        <input type="text" id="company-search" placeholder="e.g. Apple, Nvidia, Shopify…" oninput="onCompanySearchInput()" />
        <div class="hint" id="company-search-hint"></div>
      </div>
      <div class="row-2">
        <div class="field-group narrow">
          <label>Stock Ticker</label>
          <input type="text" id="ticker" placeholder="e.g. GOOG" oninput="onTickerInput()" style="text-transform:uppercase;" />
        </div>
        <div class="field-group">
          <label>Company Name</label>
          <input type="text" id="company-name" placeholder="Auto-populated from ticker" readonly class="readonly" />
          <div class="hint" id="company-hint"></div>
        </div>
      </div>
      <div class="field-group">
        <label>Yahoo Finance <span style="color:var(--accent);font-weight:400;text-transform:none;letter-spacing:0;">auto-generated, editable</span></label>
        <input type="text" id="yahoo-url" oninput="onYahooUrlInput()" style="color:var(--accent2);font-size:12px;" />
      </div>
      <div class="field-group">
        <label>Additional Research Links <span style="color:var(--muted);font-weight:400;text-transform:none;">(optional)</span></label>
        <div class="url-list" id="url-list">
          <div class="url-row">
            <span class="url-label">TradingView</span>
            <input type="text" class="url-input" placeholder="https://www.tradingview.com/chart/..." />
            <button class="remove-btn" onclick="removeUrl(this)">×</button>
          </div>
        </div>
        <button class="add-link-btn" onclick="addUrl()">+ Add another link</button>
      </div>
      <hr />
    </div>

    <!-- STEPS -->
    <div class="steps-row">
      <div class="step-pill" id="step-1"><span class="step-dot">1</span></div>
      <div class="step-connector"></div>
      <div class="step-pill" id="step-2"><span class="step-dot">2</span></div>
      <div class="step-connector"></div>
      <div class="step-pill" id="step-3"><span class="step-dot">3</span></div>
      <div class="step-connector"></div>
      <div class="step-pill" id="step-4"><span class="step-dot">4</span></div>
      <div class="step-connector"></div>
      <div class="step-pill" id="step-5"><span class="step-dot">5</span></div>
    </div>

    <!-- RESULT BANNER -->
    <div id="result-banner" style="display:none;text-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:12px;">
      <div id="result-score-line" style="font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;"></div>
      <div style="font-size:12px;color:var(--muted);">Click the button below to download the complete scorecard.</div>
    </div>

    <!-- BUTTONS -->
    <button id="start-btn" onclick="startProcessing()">▶ Start Processing</button>
    <button id="download-btn" onclick="downloadExcel()" style="display:none;">⬇ Download Excel Scorecard</button>
    <button id="restart-btn" onclick="resetApp()">Analyse another stock / Reset</button>

    <!-- ERROR -->
    <div id="error-box">
      <div id="error-msg"></div>
      <button id="diagnose-btn" onclick="runDiagnosis()">🔍 Diagnose Problem</button>
      <div id="diagnose-results"></div>
    </div>

  </div>
</div>

<footer>Stock Signal Scorecard · Powered by Claude AI</footer>

<script>
  // ── CONFIG ─────────────────────────────────────────────
  const HARDCODED_API_KEY = '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';
  const WORKER_URL = 'https://stock-screener.gregoryanderchuk.workers.dev/';
  // ───────────────────────────────────────────────────────

  let extractedData = null;
  let currentTicker = '';
  let currentCompany = '';
  let extraUrlCount = 1;
  let progressTimer = null;
  let progressCurrent = 0;
  let tickerDebounce = null;
  let yahooUrlManuallyEdited = false;

  // ── EXCHANGE ──────────────────────────────────────────
  function getSelectedExchange() {
    const checked = document.querySelector('input[name="exchange"]:checked');
    return checked ? checked.value : 'CA'; // default to Canada if nothing selected
  }

  function extractBaseTicker(raw) {
    if (!raw) return '';
    const first = raw.trim().split('.')[0];
    return first.toUpperCase().replace(/[^A-Z]/g, '');
  }

  function applyExchangeSuffix(base) {
    return getSelectedExchange() === 'CA' ? base + '.TO' : base;
  }

  function onYahooUrlInput() { yahooUrlManuallyEdited = true; }

  function updateYahooUrl(ticker) {
    if (yahooUrlManuallyEdited) return;
    const el = document.getElementById('yahoo-url');
    if (!ticker) { el.value = ''; return; }
    el.value = getSelectedExchange() === 'CA'
      ? `https://ca.finance.yahoo.com/quote/${ticker}/`
      : `https://finance.yahoo.com/quote/${ticker}`;
  }

  function onExchangeChange() {
    const cur = document.getElementById('ticker').value.trim();
    if (!cur) { updateYahooUrl(''); return; }
    const normalized = applyExchangeSuffix(extractBaseTicker(cur));
    document.getElementById('ticker').value = normalized;
    updateYahooUrl(normalized);
    setHint('resolving', '⏳ Looking up company name…');
    if (tickerDebounce) clearTimeout(tickerDebounce);
    tickerDebounce = setTimeout(() => resolveCompanyName(normalized), 400);
  }

  // ── PROGRESS ──────────────────────────────────────────
  function setProgress(pct, label, error) {
    progressCurrent = pct;
    const fill = document.getElementById('progress-bar-fill');
    fill.style.width = pct + '%';
    fill.style.background = error ? '#f85149' : 'linear-gradient(90deg,#00e676,#00b0ff)';
    const pctEl = document.getElementById('progress-pct');
    pctEl.style.color = error ? '#f85149' : '#00e676';
    pctEl.textContent = Math.round(pct) + '%';
    if (label) document.getElementById('progress-label').textContent = label;
  }

  function animateProgress(from, to, durationMs, label) {
    if (progressTimer) clearInterval(progressTimer);
    const steps = 40, inc = (to - from) / steps;
    let cur = from;
    progressTimer = setInterval(() => {
      cur += inc;
      if (cur >= to) { cur = to; clearInterval(progressTimer); }
      setProgress(cur, label);
    }, durationMs / steps);
  }

  // ── STEPS ─────────────────────────────────────────────
  function setStep(n, state) {
    for (let i = 1; i <= 5; i++) {
      const el = document.getElementById('step-' + i);
      el.className = 'step-pill';
      if (i < n) { el.classList.add('done'); el.querySelector('.step-dot').textContent = '✓'; }
    }
    const el = document.getElementById('step-' + n);
    if (el) el.classList.add(state || 'active');
  }

  // ── COMPANY NAME SEARCH (reverse lookup: name → ticker) ──
  let companySearchDebounce = null;

  function onCompanySearchInput() {
    const q = document.getElementById('company-search').value.trim();
    const hint = document.getElementById('company-search-hint');
    hint.className = 'hint';
    hint.textContent = '';
    if (companySearchDebounce) clearTimeout(companySearchDebounce);
    if (!q || q.length < 2) return;
    hint.className = 'hint resolving';
    hint.textContent = '⏳ Looking up ticker…';
    companySearchDebounce = setTimeout(() => resolveTickerFromName(q), 700);
  }

  async function resolveTickerFromName(companyQuery) {
    const hint = document.getElementById('company-search-hint');
    const apiKey = HARDCODED_API_KEY;
    if (!apiKey || apiKey === 'YOUR_API_KEY_HERE') {
      hint.className = 'hint error';
      hint.textContent = 'API key not configured';
      return;
    }
    try {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6', max_tokens: 150,
          tools: [{ type: 'web_search_20250305', name: 'web_search' }],
          system: 'You are a stock ticker lookup tool. Search Yahoo Finance for the company. Reply with EXACTLY one line: TICKER|Full Company Name\nExamples: AAPL|Apple Inc.  GOOG|Alphabet Inc. (Google)  NVDA|NVIDIA Corporation  SHOP|Shopify Inc.\nNothing else. No explanation. No extra lines. No markdown.',
          messages: [{ role: 'user', content: `Yahoo Finance ticker for: ${companyQuery}` }]
        })
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      let raw = '';
      for (const block of (data.content || [])) { if (block.type === 'text') raw += block.text; }
      raw = raw.trim();
      console.log('Ticker lookup raw:', raw);

      let tickerRaw = '', name = '';

      // Strategy 1: pipe format TICKER|Name (preferred) — TICKER may include
      // a suffix like ".TO", which is handled by extractBaseTicker() below.
      if (raw.includes('|')) {
        const parts = raw.split('|');
        tickerRaw = parts[0].trim();
        name = parts[1] ? parts[1].trim() : '';
      }

      // Strategy 2: scan for an uppercase ticker word anywhere in response
      if (!tickerRaw) {
        const lines = raw.split('\n');
        for (const line of lines) {
          const m = line.match(/\b([A-Z]{1,6}(?:\.[A-Z]{1,3})?)\b/);
          if (m) {
            tickerRaw = m[1];
            name = line.replace(m[0], '').replace(/^[\s|:\-]+/, '').trim();
            if (name.length < 2) name = '';
            break;
          }
        }
      }

      // Strategy 3: if user typed something that looks like a ticker already
      if (!tickerRaw && /^[A-Za-z]{1,6}(\.[A-Za-z]{1,3})?$/.test(companyQuery.trim())) {
        tickerRaw = companyQuery.trim();
        name = tickerRaw.toUpperCase();
      }

      const base = extractBaseTicker(tickerRaw);

      if (base && base.length >= 1 && base.length <= 6) {
        const ticker = applyExchangeSuffix(base);
        if (!name || name.length < 2) name = base;
        document.getElementById('ticker').value = ticker;
        document.getElementById('company-name').value = name;
        updateYahooUrl(ticker);
        currentCompany = name;
        hint.className = 'hint resolved';
        hint.textContent = `✓ Found: ${ticker} — ${name}`;
      } else {
        hint.className = 'hint error';
        hint.textContent = 'Could not find ticker — try entering the ticker directly in the Stock Ticker field';
        console.log('Parse failed for raw:', raw);
      }
    } catch (e) {
      hint.className = 'hint error';
      hint.textContent = 'Lookup failed — try entering the ticker directly';
      console.error('Ticker lookup error:', e);
    }
  }

  // ── TICKER INPUT ──────────────────────────────────────
  function onTickerInput() {
    const raw = document.getElementById('ticker').value.trim().toUpperCase();
    document.getElementById('ticker').value = raw;
    document.getElementById('company-name').value = '';
    yahooUrlManuallyEdited = false;
    setHint('', '');
    if (tickerDebounce) clearTimeout(tickerDebounce);
    if (!raw) { updateYahooUrl(''); return; }
    setHint('resolving', '⏳ Looking up company name…');
    tickerDebounce = setTimeout(() => {
      const normalized = applyExchangeSuffix(extractBaseTicker(raw));
      document.getElementById('ticker').value = normalized;
      updateYahooUrl(normalized);
      resolveCompanyName(normalized);
    }, 700);
  }

  function setHint(cls, text) {
    const h = document.getElementById('company-hint');
    h.className = 'hint' + (cls ? ' ' + cls : '');
    h.textContent = text;
  }

  async function resolveCompanyName(ticker) {
    const apiKey = HARDCODED_API_KEY;
    if (!apiKey || apiKey === 'YOUR_API_KEY_HERE') { setHint('error', 'API key not configured'); return; }
    try {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6', max_tokens: 100,
          tools: [{ type: 'web_search_20250305', name: 'web_search' }],
          system: 'You are a stock data assistant. When given a ticker symbol, search Yahoo Finance and return ONLY the full official company name as it appears on Yahoo Finance — nothing else, no punctuation, no explanation.',
          messages: [{ role: 'user', content: `What is the full company name for ticker ${ticker} on Yahoo Finance?` }]
        })
      });
      if (!response.ok) throw new Error('');
      const data = await response.json();
      let name = '';
      for (const block of (data.content || [])) { if (block.type === 'text') name += block.text; }
      name = name.trim().replace(/^["']|["']$/g, '');
      if (name && name.length < 120 && !name.includes('{')) {
        document.getElementById('company-name').value = name;
        setHint('resolved', '✓ Resolved');
        currentCompany = name;
      } else { setHint('', 'Will resolve when processing starts'); }
    } catch (e) { setHint('', 'Will resolve when processing starts'); }
  }

  // ── URL HELPERS ───────────────────────────────────────
  function addUrl() {
    const list = document.getElementById('url-list');
    const row = document.createElement('div');
    row.className = 'url-row';
    row.innerHTML = `<span class="url-label">Link ${++extraUrlCount}</span>
      <input type="text" class="url-input" placeholder="https://..." />
      <button class="remove-btn" onclick="removeUrl(this)">×</button>`;
    list.appendChild(row);
  }
  function removeUrl(btn) { btn.closest('.url-row').remove(); }

  // ── ERROR ─────────────────────────────────────────────
  function showError(msg) {
    document.getElementById('error-msg').textContent = '❌ ' + msg;
    document.getElementById('error-box').style.display = 'block';
    document.getElementById('diagnose-btn').style.display = 'inline-block';
    document.getElementById('diagnose-results').style.display = 'none';
    document.getElementById('diagnose-results').innerHTML = '';
  }

  // ── CHIME ─────────────────────────────────────────────
  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq, ctx.currentTime);
        const start = ctx.currentTime + i * 0.18, end = start + 0.6;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.16, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, end);
        osc.start(start); osc.stop(end);
      });
    } catch (e) {}
  }

    } catch { checks.push({ icon:'❌', label:'Internet connection', detail:'Cannot reach the internet.', fix:'Check your network connection.' }); }
    try {
      const r = await fetch(WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json','x-api-key':'test','anthropic-version':'2023-06-01'}, body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:10,messages:[{role:'user',content:'hi'}]}), signal:AbortSignal.timeout(8000) });
      const d = await r.json();
      if (d.error?.type==='authentication_error') checks.push({ icon:'✅', label:'Cloudflare Worker', detail:'Worker is reachable and forwarding correctly.', fix:null });
      else checks.push({ icon:'⚠️', label:'Cloudflare Worker', detail:'Unexpected response: '+JSON.stringify(d).slice(0,80), fix:'Try re-deploying the Worker.' });
    } catch { checks.push({ icon:'❌', label:'Cloudflare Worker', detail:'Cannot reach '+WORKER_URL, fix:'Go to Cloudflare → Workers & Pages → check it is deployed.' }); }
    if (!apiKey||apiKey==='YOUR_API_KEY_HERE') {
      checks.push({ icon:'❌', label:'Anthropic API Key', detail:'Still set to placeholder.', fix:'Open the HTML file and replace YOUR_API_KEY_HERE.' });
    } else {
      try {
        const r = await fetch(WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'}, body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:10,messages:[{role:'user',content:'hi'}]}), signal:AbortSignal.timeout(10000) });

      } catch { checks.push({ icon:'⚠️', label:'Anthropic API Key', detail:'Could not verify — Worker may be down.', fix:null }); }

    btn.disabled = false; btn.textContent = '🔍 Re-run Diagnosis';
  }
